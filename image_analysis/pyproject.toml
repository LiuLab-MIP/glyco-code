[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glyco"
version = "1.0.0"
description = "Quantitative analysis of terminal-monosaccharide multicolour fluorescence images (glyco-code)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "pillow==11.0.0",
    "scipy==1.14.1",
    "joblib==1.4.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[tool.setuptools]
packages = ["glyco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
